[project]
name = "fastapi-full"
version = "0.1.0"
description = ""
authors = [
    {name = "marlonkleinschmidt",email = "marlon.kleinschmidt@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
     "fastapi[standard] (>=0.115.12,<0.116.0)",     
     "sqlalchemy[asyncio] (>=2.0.41,<3.0.0)",     
     "pydantic-settings (>=2.14.1,<3.0.0)",     
     "alembic (>=1.18.4,<2.0.0)",     
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
typos = "^1.46.0"
pytest = "^8.4.0"
pytest-cov = "^6.2.1"
taskipy = "^1.14.1"
ruff = "^0.11.13"


[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.pytest]
pythonpath = ['.']
addopts = ['-p', 'no:warnings']

[tool.taskipy.tasks]
lint = 'ruff check .'
pre_format = 'ruff check --fix'
format = 'ruff format .'
run = 'fastapi dev fastapi_full/app.py'
pre_test = 'task lint'
test = 'pytest -s -x --cov=fastapi_full -vv'
post_test = 'coverage html'